operations:
  view:
    - type: web
      impl: index.html
hooks:
  post-app-deploy: npm run setup-db
actions: actions
web: web-src
runtimeManifest:
  database:
    auto-provision: true
    region: apac
  packages:
    login-module:
      license: Apache-2.0
      actions:
        otp:
          function: actions/otp/otp.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            apikey: $SERVICE_API_KEY
            GRAPHQL_ENDPOINT: $GRAPHQL_ENDPOINT
            GRAPHQL_API_KEY: $GRAPHQL_API_KEY
            AIO_DB_REGION: apac
          annotations:
            require-adobe-auth: false
            final: true
        config:
          function: actions/config/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            apikey: $SERVICE_API_KEY
          annotations:
            require-adobe-auth: true
            include-ims-credentials: true
            final: true
        customer:
          function: actions/customer/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            apikey: $SERVICE_API_KEY
            GRAPHQL_ENDPOINT: $GRAPHQL_ENDPOINT
            GRAPHQL_API_KEY: $GRAPHQL_API_KEY
            AIO_DB_REGION: apac
          annotations:
            require-adobe-auth: false
            final: true
        registration:
          function: actions/registration/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
          annotations:
            require-adobe-auth: true
            final: true
