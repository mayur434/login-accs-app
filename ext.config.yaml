operations:
  view:
    - type: web
      impl: index.html
actions: actions
web: web-src
runtimeManifest:
  database:
    auto-provision: false
    region: apac
  packages:
    login-module:
      license: Apache-2.0
      actions:
        generate-otp:
          function: actions/generate-otp/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            GRAPHQL_ENDPOINT: $GRAPHQL_ENDPOINT
            DB_TYPE: $DB_TYPE
            MYSQL_HOST: $MYSQL_HOST
            MYSQL_PORT: $MYSQL_PORT
            MYSQL_USER: $MYSQL_USER
            MYSQL_PASSWORD: $MYSQL_PASSWORD
            MYSQL_DATABASE: $MYSQL_DATABASE
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            MAGENTO_ENVIRONMENT_ID: $MAGENTO_ENVIRONMENT_ID
            MAGENTO_STORE_CODE: $MAGENTO_STORE_CODE
            MAGENTO_STORE_VIEW_CODE: $MAGENTO_STORE_VIEW_CODE
            MAGENTO_WEBSITE_CODE: $MAGENTO_WEBSITE_CODE
          annotations:
            require-adobe-auth: false
            include-ims-credentials: true
            final: false
        validate-otp:
          function: actions/validate-otp/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            GRAPHQL_ENDPOINT: $GRAPHQL_ENDPOINT
            DB_TYPE: $DB_TYPE
            MYSQL_HOST: $MYSQL_HOST
            MYSQL_PORT: $MYSQL_PORT
            MYSQL_USER: $MYSQL_USER
            MYSQL_PASSWORD: $MYSQL_PASSWORD
            MYSQL_DATABASE: $MYSQL_DATABASE
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            MAGENTO_ENVIRONMENT_ID: $MAGENTO_ENVIRONMENT_ID
            MAGENTO_STORE_CODE: $MAGENTO_STORE_CODE
            MAGENTO_STORE_VIEW_CODE: $MAGENTO_STORE_VIEW_CODE
            MAGENTO_WEBSITE_CODE: $MAGENTO_WEBSITE_CODE
          annotations:
            require-adobe-auth: false
            include-ims-credentials: true
            final: false
        config:
          function: actions/config/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            apikey: $SERVICE_API_KEY
            DB_TYPE: $DB_TYPE
            MYSQL_HOST: $MYSQL_HOST
            MYSQL_PORT: $MYSQL_PORT
            MYSQL_USER: $MYSQL_USER
            MYSQL_PASSWORD: $MYSQL_PASSWORD
            MYSQL_DATABASE: $MYSQL_DATABASE
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
          annotations:
            require-adobe-auth: false
            include-ims-credentials: true
            final: true
        customer:
          function: actions/customer/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            apikey: $SERVICE_API_KEY
            GRAPHQL_ENDPOINT: $GRAPHQL_ENDPOINT
            DB_TYPE: $DB_TYPE
            MYSQL_HOST: $MYSQL_HOST
            MYSQL_PORT: $MYSQL_PORT
            MYSQL_USER: $MYSQL_USER
            MYSQL_PASSWORD: $MYSQL_PASSWORD
            MYSQL_DATABASE: $MYSQL_DATABASE
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            MAGENTO_ENVIRONMENT_ID: $MAGENTO_ENVIRONMENT_ID
            MAGENTO_STORE_CODE: $MAGENTO_STORE_CODE
            MAGENTO_STORE_VIEW_CODE: $MAGENTO_STORE_VIEW_CODE
            MAGENTO_WEBSITE_CODE: $MAGENTO_WEBSITE_CODE
          annotations:
            require-adobe-auth: false
            include-ims-credentials: true
            final: true
        registration:
          function: actions/registration/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
          annotations:
            require-adobe-auth: true
            include-ims-credentials: true
            final: true
        google-sso:
          function: actions/google-sso/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            GOOGLE_CLIENT_ID: $GOOGLE_CLIENT_ID
            GRAPHQL_ENDPOINT: $GRAPHQL_ENDPOINT
            DB_TYPE: $DB_TYPE
            MYSQL_HOST: $MYSQL_HOST
            MYSQL_PORT: $MYSQL_PORT
            MYSQL_USER: $MYSQL_USER
            MYSQL_PASSWORD: $MYSQL_PASSWORD
            MYSQL_DATABASE: $MYSQL_DATABASE
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            MAGENTO_ENVIRONMENT_ID: $MAGENTO_ENVIRONMENT_ID
            MAGENTO_STORE_CODE: $MAGENTO_STORE_CODE
            MAGENTO_STORE_VIEW_CODE: $MAGENTO_STORE_VIEW_CODE
            MAGENTO_WEBSITE_CODE: $MAGENTO_WEBSITE_CODE
          annotations:
            require-adobe-auth: false
            include-ims-credentials: true
            final: false
        cleanup-otps:
          function: actions/cleanup-otps/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            OTP_RETENTION_DAYS: 7
            DB_TYPE: $DB_TYPE
            MYSQL_HOST: $MYSQL_HOST
            MYSQL_PORT: $MYSQL_PORT
            MYSQL_USER: $MYSQL_USER
            MYSQL_PASSWORD: $MYSQL_PASSWORD
            MYSQL_DATABASE: $MYSQL_DATABASE
            IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
            IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
            IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
            IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
          annotations:
            require-adobe-auth: false
            include-ims-credentials: true
            final: false
      triggers:
        otp-cleanup-nightly:
          feed: /whisk.system/alarms/alarm
          inputs:
            cron: '0 0 * * *'
            trigger_payload: '{"source":"otp-cleanup-nightly"}'
      rules:
        otp-cleanup-nightly-rule:
          trigger: otp-cleanup-nightly
          action: cleanup-otps
