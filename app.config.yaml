extensions:
  commerce/backend-ui/1:
    $include: ext.config.yaml

application:
  runtimeManifest:
    packages:
      login-module:
        license: Apache-2.0
        actions:
          otp:
            function: actions/otp/otp.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              DB_TYPE: $DB_TYPE
              MYSQL_HOST: $MYSQL_HOST
              MYSQL_PORT: $MYSQL_PORT
              MYSQL_USER: $MYSQL_USER
              MYSQL_PASSWORD: $MYSQL_PASSWORD
              MYSQL_DATABASE: $MYSQL_DATABASE
    database:
      auto-provision: false
      region: apac